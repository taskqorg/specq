name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 caveman/scripts/check.py
      - run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }}
